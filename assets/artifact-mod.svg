<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1430"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: 'Cascadia Mono', 'Cascadia Code', Consolas, 'Segoe UI Emoji', monospace; font-size: 18px; fill: #d4d4d8; }
      .dim { fill: #71717a; }
      .b { font-weight: 700; fill: #f4f4f5; }
      .cy { fill: #22d3ee; }
      .or { fill: #d97757; }
      .gr { fill: #4ade80; }
      .sel { fill: #f4f4f5; font-weight: 700; }
      .ui { font-family: 'Segoe UI', system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- terminal window -->
  <g filter="url(#shadow)">
    <rect x="60" y="56" width="1480" height="788" rx="14" fill="#18181b"/>
  </g>
  <rect x="60" y="56" width="1480" height="44" rx="14" fill="#27272a"/>
  <rect x="60" y="86" width="1480" height="14" fill="#27272a"/>
  <circle cx="90" cy="78" r="7" fill="#ff5f57"/>
  <circle cx="114" cy="78" r="7" fill="#febc2e"/>
  <circle cx="138" cy="78" r="7" fill="#28c840"/>
  <text x="800" y="84" text-anchor="middle" class="dim ui" style="font-size:15px">claude — D:\Projects\demo</text>

  <!-- conversation (left) -->
  <g>
    <text x="96" y="146"><tspan class="or">✻</tspan> <tspan class="b">Claude Code</tspan>  <tspan class="dim">· artifact-mod active</tspan></text>

    <text x="96" y="200" class="dim">&gt;</text>
    <text x="118" y="200">make a hero banner, export the Q3 report</text>
    <text x="118" y="228">as PDF, and scaffold a landing page</text>

    <text x="96" y="282" class="gr">●</text>
    <text x="118" y="282"><tspan class="b">Write</tspan>(src/render.ts)</text>
    <text x="118" y="310" class="dim">⎿  Wrote 84 lines to src/render.ts</text>

    <text x="96" y="352" class="gr">●</text>
    <text x="118" y="352"><tspan class="b">Bash</tspan>(node src/render.ts -o hero-banner.png)</text>
    <text x="118" y="380" class="dim">⎿  Rendered 1920×1080 → hero-banner.png</text>

    <text x="96" y="422" class="gr">●</text>
    <text x="118" y="422"><tspan class="b">Bash</tspan>(pandoc q3.md -o quarterly-report.pdf)</text>
    <text x="118" y="450" class="dim">⎿  (no output)</text>

    <text x="96" y="492" class="gr">●</text>
    <text x="118" y="492"><tspan class="b">Write</tspan>(site/index.html)</text>
    <text x="118" y="520" class="dim">⎿  Wrote 132 lines to site/index.html</text>

    <text x="96" y="574" class="or">●</text>
    <text x="118" y="574">Done. All three files are in the</text>
    <text x="118" y="602"><tspan class="b">Artifacts</tspan> pane — press Tab, then Enter.</text>

    <!-- prompt box -->
    <rect x="88" y="726" width="824" height="54" rx="8" fill="none" stroke="#3f3f46" stroke-width="1.5"/>
    <text x="108" y="760" class="dim">&gt;</text>
    <rect x="128" y="742" width="10" height="22" fill="#d4d4d8"/>
    <text x="96" y="812" class="dim" style="font-size:15px">? for shortcuts</text>
  </g>

  <!-- divider -->
  <line x1="944" y1="100" x2="944" y2="844" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Artifacts pane (right) -->
  <g>
    <rect x="944" y="100" width="596" height="44" fill="#1f1f23"/>
    <text x="968" y="129" class="b">Artifacts</text>
    <text x="1516" y="129" text-anchor="end" class="dim" style="font-size:15px">/artifacts</text>

    <text x="968" y="186" class="b">9 artifacts</text>
    <text x="1516" y="186" text-anchor="end" class="dim">page 1/2</text>

    <!-- selected row highlight -->
    <rect x="958" y="206" width="568" height="36" rx="6" fill="#22d3ee" fill-opacity="0.10"/>
    <text x="968" y="230" class="cy">▸</text>
    <text x="992" y="230" class="sel">🎨 hero-banner.png</text>
    <text x="1516" y="230" text-anchor="end" class="dim">D:\Projects\demo</text>

    <text x="992" y="276">📕 quarterly-report.pdf</text>
    <text x="1516" y="276" text-anchor="end" class="dim">D:\Projects\demo</text>

    <text x="992" y="322">🌐 index.html</text>
    <text x="1516" y="322" text-anchor="end" class="dim">…\demo\site</text>

    <text x="992" y="368">🎬 product-demo.mp4</text>
    <text x="1516" y="368" text-anchor="end" class="dim">…\demo\media</text>

    <text x="992" y="414">📊 metrics.csv</text>
    <text x="1516" y="414" text-anchor="end" class="dim">…\demo\data</text>

    <text x="992" y="460">📝 NOTES.md</text>
    <text x="1516" y="460" text-anchor="end" class="dim">D:\Projects\demo</text>

    <text x="992" y="506">📘 launch-brief.docx</text>
    <text x="1516" y="506" text-anchor="end" class="dim">D:\Projects\demo</text>

    <!-- buttons -->
    <rect x="968" y="556" width="112" height="38" rx="7" fill="#27272a" stroke="#3f3f46"/>
    <text x="1024" y="581" text-anchor="middle">◀ Prev</text>
    <rect x="1092" y="556" width="112" height="38" rx="7" fill="#27272a" stroke="#3f3f46"/>
    <text x="1148" y="581" text-anchor="middle">Next ▶</text>
    <rect x="1216" y="556" width="92" height="38" rx="7" fill="#d97757"/>
    <text x="1262" y="581" text-anchor="middle" style="fill:#1b1b1f;font-weight:700">Open</text>

    <text x="968" y="634" class="dim" style="font-size:16px">Tab select · Enter / double-click open · n/p page</text>

    <!-- tagline -->
    <text x="968" y="760" class="b ui" style="font-size:30px">artifact-mod</text>
    <text x="968" y="796" class="dim ui" style="font-size:17px">Every image and document your session makes, one keypress away.</text>
  </g>
</svg>
